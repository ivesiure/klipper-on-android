# Moonraker on the phone -- Ender 3 V3 SE through the userspace CH340 bridge.
# There is no systemd and no D-Bus on Android: [machine] provider MUST be "none".

[server]
host: 0.0.0.0
port: 7125
# klippy is started with -a pointing here; it is not Moonraker's default path.
klippy_uds_address: /data/data/com.termux/files/home/pdata/run/klipper.sock

[machine]
# Without this Moonraker tries systemd/dbus/policykit and does not start on Android.
provider: none

[authorization]
# The phone's address may change; a range rather than a single IP.
trusted_clients:
    192.168.0.0/16
    127.0.0.1
    ::1
# CORS authorises the PAGE (by origin); trusted_clients authorises the CLIENT (by IP).
# `http://*.local` does NOT match `http://localhost:8080` -- that wildcard is the .local
# domain, not the name localhost -- and it does not match a host with a port appended.
# Without the explicit localhost line, opening Mainsail in the phone's own browser
# answers 200 WITHOUT Access-Control-Allow-Origin, the browser drops the response and
# the interface stays on "add printer" with nothing in any log. Add every origin you
# will actually open the interface from, exactly; a wide wildcard would let any page
# on the LAN drive the printer through a logged-in browser.
cors_domains:
    http://*.local
    http://192.168.*
    http://localhost:8080

[file_manager]
enable_object_processing: False

[database]

[data_store]

[octoprint_compat]

[history]
